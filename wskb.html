<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>WSKB Live</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{

background:url("wskb.jpg") center center/cover no-repeat fixed;
height:100vh;

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}

body:before{

content:"";
position:absolute;
inset:0;

background:rgba(0,0,0,.55);
backdrop-filter:blur(10px);

}

.player{

position:relative;
z-index:10;

width:min(90%,480px);

padding:40px;

border-radius:25px;

background:rgba(255,255,255,.10);

border:1px solid rgba(255,255,255,.15);

backdrop-filter:blur(25px);

text-align:center;

color:white;

box-shadow:0 20px 60px rgba(0,0,0,.45);

}

.logo{

width:160px;
margin:auto;
margin-bottom:25px;

}

.logo img{

width:100%;
border-radius:15px;

}

.live{

display:inline-flex;
align-items:center;
gap:10px;

font-size:14px;
font-weight:600;
letter-spacing:1px;

margin-bottom:20px;

color:#ff5252;

}

.dot{

width:12px;
height:12px;

background:#ff0000;
border-radius:50%;

animation:pulse 1s infinite;

}

@keyframes pulse{

0%{
transform:scale(.8);
opacity:1;
}

50%{
transform:scale(1.3);
opacity:.5;
}

100%{
transform:scale(.8);
opacity:1;
}

}

h1{

font-size:36px;
margin-bottom:10px;

}

.subtitle{

opacity:.7;
margin-bottom:30px;

}

button{

width:90px;
height:90px;

border-radius:50%;

border:none;

cursor:pointer;

background:white;

color:#111;

font-size:34px;

transition:.25s;

margin-bottom:25px;

}

button:hover{

transform:scale(1.05);

}

input[type=range]{

width:100%;

}

footer{

margin-top:25px;
opacity:.5;
font-size:13px;

}

</style>

</head>

<body>

<div class="player">

<div class="logo">
<img src="logo.png">
</div>

<div class="live">

<div class="dot"></div>

LIVE

</div>

<h1>89.5 WSKB</h1>

<div class="subtitle">

Westfield State University Radio

</div>

<button id="play">

▶

</button>

<input type="range" id="volume"
min="0"
max="1"
step=".01"
value=".8">

<footer>

Streaming Live

</footer>

</div>

<audio id="radio">

<source src="http://wskb.westfield.ma.edu:8000/stream">

</audio>

<script>

const audio=document.getElementById("radio");
const button=document.getElementById("play");
const volume=document.getElementById("volume");

audio.volume=.8;

button.onclick=()=>{

if(audio.paused){

audio.play();

button.innerHTML="❚❚";

}else{

audio.pause();

button.innerHTML="▶";

}

}

volume.oninput=()=>{

audio.volume=volume.value;

}

</script>

</body>
</html>
